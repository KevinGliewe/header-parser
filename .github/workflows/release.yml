name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
            executable_name: "header-parser"
            artifact_name: "header-parser-linux-x64"
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            executable_name: "header-parser.exe"
            artifact_name: "header-parser-windows-x64"
          - os: macos-latest
            cmake_generator: "Unix Makefiles"
            executable_name: "header-parser"
            artifact_name: "header-parser-macos-x64"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build and test header-parser
      id: build
      uses: ./.github/actions/build-and-test
      with:
        os: ${{ matrix.os }}
        cmake-generator: ${{ matrix.cmake_generator }}
        executable-name: ${{ matrix.executable_name }}
        test-only: 'true'

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ steps.build.outputs.executable-path }}

    - name: Upload to release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ steps.build.outputs.executable-path }}
        asset_name: ${{ matrix.artifact_name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        asset_content_type: application/octet-stream